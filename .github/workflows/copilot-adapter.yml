name: Copilot adapter

on:
  pull_request:
    paths:
      - "adapters/copilot/**"
      - "plugins/dev-team/**"
      - ".github/plugin/marketplace.json"
      - ".github/workflows/copilot-adapter.yml"
      - "LICENSE"
  push:
    branches: [main]
    paths:
      - "adapters/copilot/**"
      - "plugins/dev-team/**"
      - ".github/plugin/marketplace.json"
      - ".github/workflows/copilot-adapter.yml"
      - "LICENSE"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: copilot-adapter-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Copilot adapter Linux
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: python -m pip install ruff
      - run: python -m ruff check adapters/copilot
      - run: npm run lint -- adapters/copilot/test_sdk.mjs
      - run: node --check adapters/copilot/test_sdk.mjs
      - run: python -m unittest discover -s adapters/copilot -v
      - run: python adapters/copilot/build_marketplace.py --build-number ${{ github.run_number }}

  windows:
    name: Copilot adapter Windows
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s adapters/copilot -v
      - run: python adapters/copilot/build_marketplace.py --build-number ${{ github.run_number }}

  publish:
    name: Publish Copilot marketplace
    needs: [linux, windows]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: copilot-marketplace-publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - run: python adapters/copilot/build_marketplace.py --build-number ${{ github.run_number }} --publish
